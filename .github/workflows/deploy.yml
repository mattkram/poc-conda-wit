name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync secrets to Cloudflare
        run: |
          echo "${{ secrets.GH_CLIENT_ID }}"           | npx wrangler secret put GITHUB_CLIENT_ID
          echo "${{ secrets.GH_CLIENT_SECRET }}"       | npx wrangler secret put GITHUB_CLIENT_SECRET
          echo "${{ secrets.UPLOAD_TOKEN_SECRET }}"    | npx wrangler secret put UPLOAD_TOKEN_SECRET
          echo "${{ secrets.INTERNAL_SECRET }}"        | npx wrangler secret put INTERNAL_SECRET
          echo "${{ secrets.R2_ACCESS_KEY_ID }}"       | npx wrangler secret put R2_ACCESS_KEY_ID
          echo "${{ secrets.R2_SECRET_ACCESS_KEY }}"   | npx wrangler secret put R2_SECRET_ACCESS_KEY
          echo "${{ secrets.R2_ACCOUNT_ID }}"          | npx wrangler secret put R2_ACCOUNT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply conda-channel-meta --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
